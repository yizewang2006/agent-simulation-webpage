<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Simulation Project</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link href="https://db.onlinewebfonts.com/c/33bce88f104fedc26d91518f6d8b4ca3?family=LetoSans-Bold" rel="stylesheet">
  <link href="https://db.onlinewebfonts.com/c/734e5a726f37f261ff8a0d96260612a0?family=Highway+Gothic" rel="stylesheet" type="text/css"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===================== HEADER ===================== -->
<header>
  <h1 class="title">Agent Collision Time Simulation</h1>
  <h2 class="subtitle">File：public/collision-simulation</h2>
</header>

<!-- ===================== MAIN LAYOUT ===================== -->
<!-- Canvas on the left, GUI panel on the right -->
<div class="container">
  <canvas id="canvasOne" width="1000" height="1000"></canvas>

  <!-- ===================== GUI PANEL ===================== -->
  <div class="gui-panel">
    <div class="agent-controls">
      <h2>Agent Controls</h2>

      <!-- Button to create a new agent with random attributes -->
      <div class="row-flex center-button">
        <button id="addAgent">Create Agent</button>
      </div>

      <!-- Collapsible list of all agents -->
      <div class="collapsible-section" id="agentsSection">
        <button class="collapsible-header">Agent List - Click to Expand</button>
        <div class="collapsible-content">
          <ul id="agentList" class="agent-list"></ul>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ===================== POPUP MENU ===================== -->
<!-- Appears when clicking on an agent. Shows and edits agent properties. -->
<div id="popupMenu" style="display: none; position: absolute; z-index: 10; background: #f0f0f0; border: 2px solid #333; border-radius: 10px; padding: 10px; width: 300px;">
  <h3 style="margin-top: 0; text-align: center;">Edit Agent</h3>

  <!-- ---- Collision Info Section ---- -->
  <!-- Shows collision history (past) and predicted future collisions -->
  <div id="collisionInfoSection" style="margin-bottom: 15px; padding: 10px; background: #fff3cd; border: 1px solid #ffc107; border-radius: 5px;">
    <h4 style="margin: 0 0 10px 0; color: #000000;">⚠️ Collision Record</h4>
    <div id="agentCollisionList" style="font-size: 12px; max-height: 200px; overflow-y: auto;">
      <p style="color: #ffbf00; margin: 0;">Select an agent to see collisions...</p>
    </div>
  </div>

  <!-- ---- Agent Edit Fields ---- -->
<label>Name (Click "Update" to apply):</label>
<input type="text" id="agentID">

<label>Color:</label>
<div class="color-picker" id="popupColorPicker">
  <div class="color-swatch" data-color="#000000" style="background-color: #000000;"></div>
  <div class="color-swatch" data-color="#00FF00" style="background-color: #00FF00;"></div>
  <div class="color-swatch" data-color="#0000FF" style="background-color: #0000FF;"></div>
  <div class="color-swatch" data-color="#FFFF00" style="background-color: #FFFF00;"></div>
  <div class="color-swatch" data-color="#FF00FF" style="background-color: #FF00FF;"></div>
  <div class="color-swatch" data-color="#D28E00" style="background-color: #D28E00;"></div>
</div>
  <label>Angle (deg):</label>
  <input type="text" id="popupAngle" placeholder="Angle">

  <label>Speed:</label>
  <input type="text" id="popupSpeed" placeholder="Speed">

  <label>FOV (deg):</label>
  <input type="text" id="popupFOV" placeholder="FOV">

  <label>FOV Radius:</label>
  <input type="text" id="popupRadius" placeholder="Radius">

  <label>X Position (read-only):</label>
  <input readonly type="text" id="popupX" placeholder="X">

  <label>Y Position (read-only):</label>
  <input readonly type="text" id="popupY" placeholder="Y">

  <div class="center-button">
    <button id="popupUpdate">Update</button>
    <button id="popupClose">Close</button>
  </div>
</div>

<!-- ===================== CANVAS INIT ===================== -->
<script>
  var canvas = document.getElementById('canvasOne');
  var ctx = canvas.getContext('2d');
</script>

<!-- ===================== MAIN SIMULATION SCRIPT ===================== -->
<script type="module">
  import { Agent } from "./collision_agent.js";
  import { ObstacleManager, Obstacle } from "./obstacle.js";

  // =====================
  // STATE VARIABLES
  // =====================
  let selectedAgent = null; // currently selected agent (via click)
  let agentCount = 0;       // total agents created (used for naming)
  let agents = [];           // all active agents in the simulation
  let simTime = 0;           // simulation clock in seconds

  // Tracks which agent pairs are currently colliding to avoid duplicate logs
  // Key: "i-j", Value: true/false
  const collisionCooldowns = new Map();

  // =====================
  // DRAG STATE
  // =====================
  let isDragging = false;
  let dragOffset = { x: 0, y: 0 };

  // =====================
  // AGENT LIST (UI)
  // =====================
  const agentList = document.getElementById('agentList');
  const agentSection = document.getElementById('agentsSection');

  // Expand the agent list by default on load
  agentSection.classList.add('active');

  // Adds a new entry (color button + name label) to the sidebar agent list
  function addAgentToList(agent, listElement) {
    const li = document.createElement('li');
    li.className = 'agent-entry';

    // Small circular color button — clicking it opens the popup
    const colorBtn = document.createElement('button');
    colorBtn.className = 'agent-color-btn';
    colorBtn.style.backgroundColor = agent.colorHex;
    colorBtn.dataset.color = agent.colorHex;
    colorBtn.addEventListener('click', () => {
      selectAgent(agent, null, null, true);
    });

    // Agent name label
    const textSpan = document.createElement('span');
    textSpan.textContent = agent.id;

    li.appendChild(colorBtn);
    li.appendChild(textSpan);
    listElement.appendChild(li);

    // Store DOM references on the agent so we can update them later
    agent.domReferences = { li, colorBtn, label: textSpan };
  }

  // =====================
  // CANVAS MOUSE EVENTS
  // =====================
  canvas.addEventListener('mousedown', handleCanvasMouseDown);
  canvas.addEventListener('mousemove', handleCanvasMouseMove);
  canvas.addEventListener('mouseup', stopDragging);
  canvas.addEventListener('mouseleave', stopDragging);

  // On click: find which agent was clicked and select it
  function handleCanvasMouseDown(e) {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    isDragging = false;
    selectedAgent = null;

    for (let agent of agents) {
      const dist = Math.sqrt(
        (mouseX - agent.position.x) ** 2 + (mouseY - agent.position.y) ** 2
      );
      // Use 2x radius as hit area for easier clicking
      if (dist <= agent.radius * 2) {
        selectAgent(agent, mouseX, mouseY);
        break;
      }
    }
  }

  // While dragging: move the selected agent with the mouse
  function handleCanvasMouseMove(e) {
    if (!isDragging || !selectedAgent) return;

    // Hide popup while dragging so it doesn't get in the way
    document.getElementById('popupMenu').style.display = 'none';

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    let newX = mouseX + dragOffset.x;
    let newY = mouseY + dragOffset.y;

    // Clamp so the agent doesn't go outside the canvas
    newX = Math.max(selectedAgent.radius, Math.min(newX, canvas.width - selectedAgent.radius));
    newY = Math.max(selectedAgent.radius, Math.min(newY, canvas.height - selectedAgent.radius));

    selectedAgent.position.x = newX;
    selectedAgent.position.y = newY;
  }

  function stopDragging() {
    isDragging = false;
  }

  // =====================
  // SELECT AGENT
  // =====================
  // Called either from a canvas click or from the sidebar list
  function selectAgent(agent, mouseX, mouseY, fromList = false) {
    selectedAgent = agent;

    if (!fromList && mouseX != null && mouseY != null) {
      // Clicked from canvas — enable dragging and show popup near agent
      dragOffset.x = agent.position.x - mouseX;
      dragOffset.y = agent.position.y - mouseY;
      isDragging = true;

      const popup = document.getElementById('popupMenu');
      popup.style.left = `${agent.position.x + 100}px`;
      popup.style.top = `${agent.position.y + 100}px`;
      popup.style.display = 'block';
    } else {
      // Clicked from sidebar — show popup at fixed position
      isDragging = false;
      const popup = document.getElementById('popupMenu');
      popup.style.left = "1250px";
      popup.style.top = "200px";
      popup.style.display = "block";
    }

    // Populate popup fields with agent's current values
    highlightSelectedSwatch(agent.colorHex);
    document.getElementById('agentID').value = agent.id;
    document.getElementById('popupAngle').value = (-agent.angle * 180 / Math.PI).toFixed(2);
    document.getElementById('popupSpeed').value = Math.sqrt(agent.dx ** 2 + agent.dy ** 2).toFixed(2);
    document.getElementById('popupFOV').value = (agent.fovAngle * 180 / Math.PI).toFixed(2);
    document.getElementById('popupRadius').value = agent.fovRadius.toFixed(2);
    document.getElementById('popupX').value = agent.position.x.toFixed(2);
    document.getElementById('popupY').value = agent.position.y.toFixed(2);

    // Show collision info in popup
    updateAgentCollisionInfo(agent);
  }

  // =====================
  // COLLISION INFO PANEL
  // =====================
  // Displays past collision history and predicted future collisions for selected agent
  function updateAgentCollisionInfo(agent) {
    const collisionListDiv = document.getElementById('agentCollisionList');
    if (!collisionListDiv || !agent) return;

    // --- Past collisions (logged during simulation) ---
    const historyHTML = agent.collisionLog.length === 0
      ? '<p style="color:#666; margin:0;">No collisions yet</p>'
      : agent.collisionLog.map(c =>
          `<div style="margin:3px 0; font-family:monospace; font-size:11px;">
            💥 <strong>${c.with}</strong> at <strong>${c.time}s</strong>
          </div>`
        ).join('');

    // --- Future collision predictions (using trajectory math) ---
    let predicted = [];
    agents.forEach(other => {
      if (other === agent) return;
      const collision = agent.getCollisionPoint(other);
      if (collision && collision.time < 200) {
        predicted.push({
          agentName: other.id,
          time: collision.time,
          location: { x: collision.x.toFixed(0), y: collision.y.toFixed(0) }
        });
      }
    });
    predicted.sort((a, b) => a.time - b.time);

    const predictedHTML = predicted.length === 0
      ? '<p style="color:#666; margin:0;">No collisions predicted</p>'
      : predicted.map(c =>
          `<div style="margin:5px 0; padding:5px; background:white; border-left:3px solid #dc3545; font-family:monospace;">
            <strong style="color:#dc3545;">${c.agentName}</strong> in <strong>${c.time.toFixed(1)}s</strong><br>
            <span style="color:#666; font-size:10px;">at (${c.location.x}, ${c.location.y})</span>
          </div>`
        ).join('');

    collisionListDiv.innerHTML = `
      ${historyHTML}
`;
  }

  // =====================
  // COLOR SWATCH
  // =====================
  function highlightSelectedSwatch(colorHex) {
    swatches.forEach(swatch => {
      const swatchColor = swatch.getAttribute('data-color');
      swatch.style.border = (swatchColor === colorHex) ? '2px solid #333' : '2px solid #fff';
    });
  }

  const swatches = document.querySelectorAll('.color-swatch');
  swatches.forEach(swatch => {
    swatch.addEventListener('click', function () {
      const color = this.getAttribute('data-color');
      if (selectedAgent) {
        selectedAgent.colorHex = color;
        selectedAgent.originalColor = color;
        if (selectedAgent.domReferences?.colorBtn) {
          selectedAgent.domReferences.colorBtn.style.backgroundColor = color;
        }
      }
      highlightSelectedSwatch(color);
    });
  });

  // =====================
  // UPDATE VIA POPUP
  // =====================
  function updateViaPopup() {
    if (!selectedAgent) return;

    const degToRad = d => d * Math.PI / 180;

    // Update name
    selectedAgent.id = document.getElementById('agentID').value;

    // Update angle
    const angleDeg = parseFloat(document.getElementById('popupAngle').value);
    if (!isNaN(angleDeg)) selectedAgent.angle = -degToRad(angleDeg);

    // Recompute dx/dy from speed and angle
    const spd = parseFloat(document.getElementById('popupSpeed').value);
    if (!isNaN(spd)) {
        selectedAgent.dx = spd * Math.cos(selectedAgent.angle);
        selectedAgent.dy = spd * Math.sin(selectedAgent.angle);
    }

    // Update FOV
    const fovDeg = parseFloat(document.getElementById('popupFOV').value);
    if (!isNaN(fovDeg)) selectedAgent.fovAngle = degToRad(fovDeg);

    const fovRadius = parseFloat(document.getElementById('popupRadius').value);
    if (!isNaN(fovRadius)) selectedAgent.fovRadius = Math.max(0, fovRadius);

    // ← REMOVED position lines, agent keeps its current position

    // Sync sidebar
    if (selectedAgent.domReferences?.label)
        selectedAgent.domReferences.label.textContent = selectedAgent.id;
    if (selectedAgent.domReferences?.colorBtn)
        selectedAgent.domReferences.colorBtn.style.backgroundColor = selectedAgent.colorHex;
}

  document.getElementById('popupUpdate').addEventListener('click', updateViaPopup);

  document.getElementById('popupClose').addEventListener('click', () => {
    document.getElementById('popupMenu').style.display = 'none';
  });

  // =====================
  // CREATE AGENT
  // =====================
  function randomAttributes() {
    const radius = 5;
    const x = Math.random() * (canvas.width - 2 * radius) + radius;
    const y = Math.random() * (canvas.height - 2 * radius) + radius;
    const dx = (Math.random() - 0.5) * 4; // speed range ~0 to 2.83 px/frame
    const dy = (Math.random() - 0.5) * 4;
    const angle = Math.atan2(dy, dx);
    return { x, y, dx, dy, angle, radius };
  }

  document.getElementById("addAgent").addEventListener("click", () => {
    agentCount++;
    const name = `Agent ${agentCount}`;
    const { x, y, dx, dy, angle, radius } = randomAttributes();
    const agent = new Agent(false, x, y, radius, dx, dy, '#D28E00', 100, 5 * Math.PI / 6, angle, name, ctx, canvas);
    agents.push(agent);
    addAgentToList(agent, agentList);
  });

  // =====================
  // COLLAPSIBLE SECTIONS
  // =====================
  document.querySelectorAll('.collapsible-header').forEach(header => {
    header.addEventListener('click', function () {
      this.parentElement.classList.toggle('active');
    });
  });

  // =====================
  // COLLISION DETECTION
  // =====================
  // Loops all agent pairs every frame, detects physical overlap,
  // and logs each collision once to both agents' collisionLog arrays.
  function checkCollisions() {
    for (let i = 0; i < agents.length; i++) {
      for (let j = i + 1; j < agents.length; j++) {
        const a1 = agents[i];
        const a2 = agents[j];

        const dx = a1.position.x - a2.position.x;
        const dy = a1.position.y - a2.position.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const key = `${i}-${j}`;

        if (dist <= a1.radius + a2.radius) {
          // Only log once per collision event (cooldown until they separate)
          if (!collisionCooldowns.get(key)) {
            const t = parseFloat(simTime.toFixed(1));
            a1.collisionLog.push({ with: a2.id, time: t });
            a2.collisionLog.push({ with: a1.id, time: t });
            collisionCooldowns.set(key, true);
          }
        } else {
          // Reset so next overlap is treated as a new collision
          collisionCooldowns.set(key, false);
        }
      }
    }
  }

  // =====================
  // GUI UPDATE LOOP
  // =====================
  // Refreshes popup fields every 500ms — slow enough that user can type without interruption
  function updateGUI() {
    if (!selectedAgent) return;

    const active = document.activeElement; // which field user is currently typing in

    // Only update fields the user is NOT currently typing in
    if (active !== document.getElementById('popupSpeed'))
        document.getElementById('popupSpeed').value = Math.sqrt(selectedAgent.dx ** 2 + selectedAgent.dy ** 2).toFixed(2);

    if (active !== document.getElementById('popupAngle'))
        document.getElementById('popupAngle').value = (-selectedAgent.angle * 180 / Math.PI).toFixed(2);

    if (active !== document.getElementById('popupFOV'))
        document.getElementById('popupFOV').value = (selectedAgent.fovAngle * 180 / Math.PI).toFixed(2);

    if (active !== document.getElementById('popupRadius'))
        document.getElementById('popupRadius').value = selectedAgent.fovRadius.toFixed(2);

    if (active !== document.getElementById('agentID'))
        document.getElementById('agentID').value = selectedAgent.id;

    // X and Y are readonly so always safe to update
    document.getElementById('popupX').value = selectedAgent.position.x.toFixed(2);
    document.getElementById('popupY').value = selectedAgent.position.y.toFixed(2);
}

  // Refresh collision info panel every 500ms while popup is open
  setInterval(() => {
    if (selectedAgent && document.getElementById('popupMenu').style.display !== 'none') {
      updateAgentCollisionInfo(selectedAgent);
    }
  }, 500);

  // =====================
  // OBSTACLE
  // =====================
  const obstacleManager = new ObstacleManager();
  obstacleManager.add(new Obstacle("Rock", [ 
    { x: 720, y: 260 },
    { x: 820, y: 280 },
    { x: 860, y: 340 },
    { x: 830, y: 410 },
    { x: 760, y: 430 },
    { x: 700, y: 380 },
    { x: 690, y: 310 }

  ], "#59412D", ctx));
  obstacleManager.add(new Obstacle("Wall", [
    { x: 100, y: 500 }, { x: 800, y: 500 }, { x: 800, y: 520 }, { x: 100, y: 520 }
  ], "#ACAD9D", ctx));

  // =====================
  // ANIMATION LOOP
  // =====================
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    agents.forEach(agent => agent.updatePosition([])); // ← [] stops freezing
    checkCollisions();
    obstacleManager.update(agents, simTime); // ← ADD
    simTime += 1 / 60;
    requestAnimationFrame(animate);
  }

  animate(); // kick off simulation
</script>

</body>
</html>
